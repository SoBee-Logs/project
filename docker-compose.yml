services:
  elasticsearch:
    build: ./elasticsearch
    container_name: sobee-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - sobee-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  ssh-tunnel:
    image: alpine:latest
    container_name: sobee-ssh-tunnel
    volumes:
      - ${SSH_KEY_PATH}:/root/.ssh/id_rsa:ro
    ports:
      - "3307:3306"
    environment:
      - DB_HOST=${DB_HOST}
      - SSH_USER=${SSH_USER}
      - SSH_JUMP_HOST=${SSH_JUMP_HOST}
    command: >
      sh -c "apk add --no-cache openssh-client netcat-openbsd &&
             cp /root/.ssh/id_rsa /tmp/id_rsa &&
             chmod 600 /tmp/id_rsa &&
             ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ExitOnForwardFailure=yes -N -L 0.0.0.0:3306:${DB_HOST}:3306 -i /tmp/id_rsa ${SSH_USER}@${SSH_JUMP_HOST}"
    networks:
      - sobee-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3306 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=
      - VITE_FASTAPI_BASE_URL=http://fastapi:8000
    depends_on:
      - spring
      - fastapi
    networks:
      - sobee-net

  spring:
    build:
      context: ./backend/spring
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env                  # 공통 (RDS, SSH)
      - backend/spring/.env   # Spring 전용 (JWT, API Key)
    environment:
      - DB_HOST=ssh-tunnel
      - DB_PORT=3306
      - FASTAPI_BASE_URL=http://fastapi:8000
      - ES_URI=http://elasticsearch:9200
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      elasticsearch:
        condition: service_healthy
      ssh-tunnel:
        condition: service_healthy
    networks:
      - sobee-net

  fastapi:
    build:
      context: ./backend/fastapi
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env                  # 공통 (RDS, SSH)
      - backend/fastapi/.env  # FastAPI 전용 (AI, Codef)
    environment:
      - DB_HOST=ssh-tunnel
      - DB_PORT=3306
    depends_on:
      ssh-tunnel:
        condition: service_healthy
    networks:
      - sobee-net

networks:
  sobee-net:
    driver: bridge

volumes:
  es_data:
    driver: local
