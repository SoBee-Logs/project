version: '3.9'

services:
  elasticsearch:
    build: ./elasticsearch
    container_name: sobee-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - sobee-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=
      - VITE_FASTAPI_BASE_URL=http://fastapi:8000
    depends_on:
      - spring
      - fastapi
    networks:
      - sobee-net

  spring:
    build:
      context: ./backend/spring
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - FASTAPI_BASE_URL=http://fastapi:8000
      - INTERNAL_SECRET_KEY=${INTERNAL_SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - ES_URI=http://elasticsearch:9200
      - FINANCE_API_KEY=${FINANCE_API_KEY}
      - CARDGORILLA_API_KEY=${CARDGORILLA_API_KEY}
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - sobee-net

  fastapi:
    build:
      context: ./backend/fastapi
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - INTERNAL_SECRET_KEY=${INTERNAL_SECRET_KEY}
      - CODEF_CLIENT_ID=${CODEF_CLIENT_ID}
      - CODEF_CLIENT_SECRET=${CODEF_CLIENT_SECRET}
      - CODEF_PUBLIC_KEY=${CODEF_PUBLIC_KEY}
    networks:
      - sobee-net

networks:
  sobee-net:
    driver: bridge

volumes:
  es_data:
    driver: local
