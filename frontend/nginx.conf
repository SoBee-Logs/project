server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;  

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://spring:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/lifecycle/ {
        proxy_pass http://10.250.1.252:8000;
        proxy_set_header Host $host;
    }

    location /api/avatar/ {
        # proxy_pass http://fastapi:8000;
        proxy_pass http://10.250.1.252:8000;
        proxy_set_header Host $host;
    }

    location /api/vlm/ {
        # proxy_pass http://fastapi:8000;
        proxy_pass http://10.250.1.252:8000;
        proxy_set_header Host $host;
    }

    # location /api/diary/generate {
    #     # proxy_pass http://fastapi:8000;
    #     proxy_pass http://10.250.1.252:8000;
    #     proxy_set_header Host $host;
    # }

    location /api/report/alert {
        proxy_pass http://spring:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/report/ {
        # proxy_pass http://fastapi:8000;
        proxy_pass http://10.250.1.252:8000;
        proxy_set_header Host $host;
    }

    location /report/ {
        # proxy_pass http://fastapi:8000;
        proxy_pass http://10.250.1.252:8000;
        proxy_set_header Host $host;
    }

    location /search {
        # proxy_pass http://fastapi:8000;
        proxy_pass http://10.250.1.252:8000;
        proxy_set_header Host $host;
    }
}
