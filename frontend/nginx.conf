server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://spring:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/vlm/ {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
    }

    location /api/diary/generate {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
    }

    location /report/ {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
    }

    location /search {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
    }
}
